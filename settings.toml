[experiment]
tilt_axis = -9.5
add_specimen_tilt = 5.2
add_specimen_pitch = 0
voltage = 300
amplitude = 0.09
cs = 2.7
#phase_shift = 0
#thickness = 80

[preprocessing]
run = false
exclude_blank_views = true
#exclude_stack_indices = [0,1,2]

[alignment.coarse]
run = false
check_rotation = true
fit_rotation = true
fit_tilt = true
fit_pitch = true

[alignment.ctf]
run = true
patch_size_ang = 500
patch_size = 512
resolution_range = [30, 4]
n_images_in_initial_average = 3
check_defocus_gradient = true

fit_rotation = true
fit_tilt = true
fit_pitch = true
fit_astigmatism = true

fit_phase_shift = false
fit_thickness = false

[alignment.refine]
run = false
correct_ctf = true
phase_flip_strength = 8
fit_rotation = false
fit_tilt = true
fit_pitch = true
fit_thickness = false

[postprocessing]
run = false
resolution = 16

stack.run = true
stack.correct_rotation = false
stack.interpolation = 'linear'
stack.dtype = 'f16'

tomogram.run = true
tomogram.correct_rotation = true
tomogram.dtype = 'f16'

tomogram.algorithm = 'fourier-wbp' # or real-wp
tomogram.interpolation = 'linear'
tomogram.oversampling_factor = 4
tomogram.ramp_filter = false

tomogram.correct_ctf = true
tomogram.z_padding_percent = 10
tomogram.phase_flip_strength = 0.7

[compute]
device = 'auto'
n_threads = 8
register_stack = true
log_level = 'trace'
