[files]

stack_file = '~/Datasets/10304/tilt5.mrc'
mdoc_file = '~/Datasets/10304/file.mdoc'
output_directory = '~/Tmp/quinoa/10304/003'
frames_directory = '~/Datasets/10304/frames'
star_file = '~/Tmp/quinoa/10304/001/tilt5.star'

#stack_file = '~/Datasets/12104/TS_006.st'
#mdoc_file = '~/Datasets/12104/TS_006.mdoc'
#output_directory = '~/Tmp/quinoa/12104/001'
#framces_directory = '~/Tmp/quinoa/12104/001'

[experiment]
#tilt_axis = 0
#add_specimen_tilt = 0
#add_specimen_pitch = 0
#voltage = 300
#amplitude = 0.07
#cs = 2.7
#phase_shift = 0
#thickness = 350

[preprocessing]
run = false
exclude_blank_views = true
exclude_stack_images = []

[alignment.coarse]
run = false
check_rotation = true
fit_rotation = true
fit_tilt = true
fit_pitch = true

[alignment.ctf]
run = true
check_defocus_gradient = true
fit_rotation = false
fit_tilt = true
fit_pitch = true
fit_phase_shift = false
fit_astigmatism = true
fit_thickness = false

[alignment.refine]
run = false
fit_thickness = false

[postprocessing]
run = true
resolution = 20
stack.run = true
stack.correct_rotation = true
stack.interpolation = 'linear'
stack.dtype = 'f16'
tomogram.run = false
tomogram.correct_rotation = true
tomogram.interpolation = 'linear'
tomogram.dtype = 'f16'
tomogram.oversample = false
tomogram.correct_ctf = false
tomogram.z_padding_percent = 10
tomogram.phase_flip_strength = 8

[compute]
device = 'auto'
n_threads = 8
register_stack = true
log_level = 'trace'
