[data]
mdocs = '/home/thomas/datasets/10304/*.mdoc'
stacks = '/home/thomas/datasets/10304/*.mrc'
output = '/home/thomas/datasets/tmp/quinoa/10304'

[experiment]
tilt_axis = 175
#voltage = 300
#amplitude = 0.09
#cs = 2.7
#phase_shift = 0
#thickness = 150

[preprocessing]
run = false
exclude_blank_views = true
#exclude_stack_indices = [0,1,2]

[alignment.coarse]
run = false

[alignment.ctf]
run = true
patch_size_min_pix = 450
patch_size_ang = 650
resolution_range = [30, 4]
nb_images_in_initial_average = 3
max_nb_high_resolution_recovery = 0
astigmatism_tilt_resolution = [5, -4]
phase_shift_time_resolution = [2, 3]
check_defocus_gradient = true
fit_rotation = false
fit_tilt = true
fit_pitch = true
fit_astigmatism = true
fit_phase_shift = false
fit_thickness = false

[alignment.refine]
run = false

[postprocessing]
run = false

[compute]
#device = 'auto'
#n_threads = 12
#dry = false
#stop_at_first_error = true
#register_stack = true
#log_level = 'trace'
